name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify local configuration is not tracked
        shell: bash
        run: |
          if [[ -n "$(git ls-files -- 'APIConfig.swift' '**/APIConfig.swift')" ]]; then
            echo '::error::APIConfig.swift must not be committed. Use the example template.'
            exit 1
          fi

      - name: Prepare non-secret build configuration
        run: |
          mkdir -p walknjoy/walknjoy/Core/Config
          if [ ! -f walknjoy/walknjoy/Core/Config/APIConfig.swift ]; then
            cp config/APIConfig.swift.example walknjoy/walknjoy/Core/Config/APIConfig.swift
          fi
          xcodebuild -version

      - name: Resolve locked Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project walknjoy/walknjoy.xcodeproj \
            -scheme walknjoy \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Build for iOS Simulator
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          xcodebuild build \
            -project walknjoy/walknjoy.xcodeproj \
            -scheme walknjoy \
            -configuration "$BUILD_CONFIGURATION" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO
